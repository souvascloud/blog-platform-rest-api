spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blog_db}
    username: ${SPRING_DATASOURCE_USERNAME:blog_user}
    password: ${SPRING_DATASOURCE_PASSWORD:blog_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:dev-secret-change-me}
      access-token-expiry-minutes: ${APP_SECURITY_JWT_ACCESS_EXP_MIN:15}
      refresh-token-expiry-days: ${APP_SECURITY_JWT_REFRESH_EXP_DAYS:7}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
